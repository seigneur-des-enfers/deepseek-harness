name: DeepSeek Harness Execution

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Ordre ou tâche à confier à la liche'
        required: true
        default: 'Réveille-toi et obéis à ton Suzerain.'

jobs:
  executer-ordre:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installation des dépendances locales du dépôt
        run: |
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          # Installe le paquet Python local présent dans le dépôt
          pip install . || echo "Installation locale alternative..."

      - name: Exécution de la tâche
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # Lance dsh ou le module correspondant
          dsh headless "${{ github.event.inputs.prompt }}"
