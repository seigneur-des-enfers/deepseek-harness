name: DeepSeek Harness Execution

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Ordre ou tâche à confier à la liche'
        required: true
        default: 'Réveille-toi et obéis à ton Suzerain.'

jobs:
  executer-ordre:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Exécution de l'ordre par la Liche
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python run_deepseek.py "${{ github.event.inputs.prompt }}"
